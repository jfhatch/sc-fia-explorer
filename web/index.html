<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://basemap.nationalmap.gov; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Map and history of South Carolina Forest Inventory and Analysis plots from public FIADB data.">
<title>SC FIA plot explorer</title>
<link rel="stylesheet" href="vendor/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="vendor/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="vendor/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
<link rel="stylesheet" href="app.css">
</head>
<body class="mapbody">
<div id="top">
  <button id="filtbtn" type="button" class="mobile-only" aria-controls="side" aria-expanded="false">☰ Filters</button>
  <h1>SC FIA plot explorer</h1>
  <div class="searchrow">
    <input id="idq" type="text" autocomplete="off" spellcheck="false" placeholder="Plot ID: 91-25, 45-3-91-25, York 25 or PLOT CN" aria-label="Plot ID">
    <button id="idgo" type="button">Find</button>
  </div>
  <button id="locbtn" type="button">Location</button>
  <button id="attrbtn" type="button">Attributes</button>
  <span class="grow"></span>
  <a class="toplink" href="about.html">About</a>
</div>
<div id="main">
  <aside id="side" aria-label="Filters">
    <h2>Showing <span id="count">…</span> plot locations <button id="sideclose" type="button" class="mobile-only close" aria-label="Close filters">×</button></h2>
    <div class="row"><label for="f_cty">County</label><select id="f_cty"><option value="">All counties</option></select></div>
    <div class="row"><label for="f_ft">Forest type</label><select id="f_ft"><option value="">All forest types</option></select></div>
    <div class="row"><label for="f_own">Owner group</label><select id="f_own"><option value="">All owners</option></select></div>
    <div class="row"><label>Last visit</label><input id="f_last0" type="number" inputmode="numeric" aria-label="Last visit from"><input id="f_last1" type="number" inputmode="numeric" aria-label="Last visit to"></div>
    <div class="row"><label for="f_nv">Visits ≥</label><input id="f_nv" type="number" inputmode="numeric" min="1" value="1"></div>
    <div class="row"><label for="f_des">Design</label><select id="f_des"><option value="">Any</option><option value="a">Annual (national design)</option><option value="p">Periodic only</option><option value="ap">Both at one key</option></select></div>
    <div class="row"><label for="f_inv">Invasives</label><select id="f_inv"><option value="">Any</option><option value="1">Present</option><option value="0">None recorded</option></select></div>
    <div class="row"><button id="f_reset" type="button">Reset filters</button></div>
    <h2>Latest forest type group</h2>
    <div id="legend"></div>
    <h2>Basemap</h2>
    <div class="row"><select id="basemap" aria-label="Basemap">
      <option value="topo">USGS Topo</option><option value="imgtopo">USGS Imagery + Topo</option>
      <option value="img">USGS Imagery only</option><option value="plain">Plain (no tiles)</option></select></div>
    <p class="muted" id="basenote"></p>
    <p class="muted" id="coordnote"></p>
  </aside>
  <div id="map" role="region" aria-label="Map of plot locations"></div>
</div>
<footer id="footer" class="footer"></footer>
<div id="drawer" class="hidden" role="dialog" aria-modal="false"></div>

<template id="tpl-loc">
  <h3>Search by location <button class="close" type="button" aria-label="Close">×</button></h3>
  <p class="muted">Enter a point in decimal degrees (dd.dddd and -dd.dddd; west is negative) or degrees-minutes-seconds (dd° mm' ss" N and dd° mm' ss" W).
    The search runs in this browser over the public plot coordinates already loaded. The point is not sent anywhere, not saved and not added to the address bar.</p>
  <div class="row"><label for="l_lat">Latitude</label><input id="l_lat" type="text" inputmode="decimal" autocomplete="off" spellcheck="false"></div>
  <div class="row"><label for="l_lon">Longitude</label><input id="l_lon" type="text" inputmode="decimal" autocomplete="off" spellcheck="false"></div>
  <div class="row"><label for="l_rad">Radius (mi)</label><input id="l_rad" type="number" inputmode="decimal" min="0.1" step="0.1" value="2" autocomplete="off"></div>
  <div class="row"><button id="l_go" type="button" class="primary">Find nearest plots</button><button id="l_clear" type="button">Clear and forget</button></div>
  <div class="note" id="l_note"></div>
  <div id="l_out"></div>
</template>

<template id="tpl-attr">
  <h3>Search by attributes <button class="close" type="button" aria-label="Close">×</button></h3>
  <div class="row"><label for="a_cty">County</label><select id="a_cty"><option value="">Any</option></select></div>
  <div class="row"><label for="a_grp">Type group</label><select id="a_grp"><option value="">Any</option></select></div>
  <div class="row"><label for="a_ft">Forest type</label><select id="a_ft"><option value="">Any</option></select></div>
  <div class="row"><label for="a_own">Owner</label><select id="a_own"><option value="">Any</option></select></div>
  <div class="row"><label>Stand age</label><input id="a_age0" type="number" inputmode="numeric" placeholder="min"><input id="a_age1" type="number" inputmode="numeric" placeholder="max"></div>
  <div class="row"><label>Last visit</label><input id="a_last0" type="number" inputmode="numeric" placeholder="from"><input id="a_last1" type="number" inputmode="numeric" placeholder="to"></div>
  <div class="row"><label for="a_des">Design</label><select id="a_des"><option value="">Any</option><option value="annual">Annual</option><option value="periodic">Periodic</option></select></div>
  <div class="row"><label for="a_inv">Invasives</label><select id="a_inv"><option value="">Any</option><option value="1">Present</option><option value="0">None</option></select></div>
  <div class="row"><button id="a_go" type="button" class="primary">Search</button><button id="a_map" type="button" disabled>Show only these on the map</button></div>
  <p class="muted">Stand age and forest type are from the latest visit's dominant accessible forest condition.</p>
  <div id="a_out"></div>
</template>

<script src="vendor/leaflet/1.9.4/leaflet.js"></script>
<script src="vendor/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="fia.js"></script>
<script src="map.js"></script>
</body>
</html>
